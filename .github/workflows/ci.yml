# The checks that block a release: any failure turns the PR red.
# To save the account's CI minutes, they only run on PRs into main (releases and hotfixes).
# PRs into develop run nothing here: `npm run verify` runs locally before each push (AGENTS.md).
# The steps live in .github/actions/verify, shared with Publishing.
# The Playwright suite is split into 4 jobs that run side by side: Chromium in 1,
# WebKit (about 3 times slower) in 3. Lighthouse runs in a job of its own.
# Documentation-only PRs do not run this workflow.
name: Checks

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'CONTEXT.md'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: ['chromium 1/1', 'webkit 1/3', 'webkit 2/3', 'webkit 3/3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: ./.github/actions/verify
        with:
          part: ${{ matrix.part }}

      - name: Playwright report
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 2

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: ./.github/actions/verify
        with:
          lighthouse: true

      # The Lighthouse HTML reports are a help: if the account's artifact quota
      # is full, the upload fails without turning the PR red. The targets are already in the job summary.
      - name: Lighthouse reports
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 7
          if-no-files-found: ignore
